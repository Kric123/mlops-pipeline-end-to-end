name: CI

# Run on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Train model (creates the MLflow registry entry)
        run: python src/train.py

      - name: Export baked model artifact (used by the API + Docker image)
        run: python src/export_model.py

      - name: Run tests
        run: pytest

      # Building the image on CI proves the Dockerfile + artifact stay valid.
      - name: Build Docker image
        run: docker build -t breast-cancer-api:ci .
